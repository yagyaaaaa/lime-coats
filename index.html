<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limecoats | Luxury Lime Finish</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="white-wall">
        <div class="scroll-indicator">Scroll down to paint</div>
    </div>

    <div class="painted-wall" id="painted-wall">
        <div class="content-wrapper">
            <img src="lclogo.png" alt="Limecoats Logo" class="brand-logo">
            <h1>Luxury Lime Finish</h1>
            <p class="slogan">Breathable. Artisanal. Timeless.</p>
            <div class="contact-block">
                <span>INQUIRIES: ROARINGKILLINLION@GMAIL.COM</span>
                <span>CONNECT: +91 84335 52656</span>
            </div>
        </div>
    </div>

    <img src="roller.png" alt="Paint Roller" class="roller-img" id="roller">

    <script>
        document.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const maxScroll = document.body.scrollHeight - window.innerHeight;

            // Calculate percentage scrolled (0 to 1)
            let scrollPercent = scrolled / maxScroll;
            if (scrollPercent > 1) scrollPercent = 1;
            if (scrollPercent < 0) scrollPercent = 0;

            // 1. Unhide the blue wall from top to bottom
            const paintedWall = document.getElementById('painted-wall');
            paintedWall.style.clipPath = `inset(0 0 ${100 - (scrollPercent * 100)}% 0)`;

            // 2. Move the roller down the screen
            const roller = document.getElementById('roller');
            roller.style.transform = `translateY(${scrollPercent * 100}vh)`;
        });
    </script>

</body>

</html>
