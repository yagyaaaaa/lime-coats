<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limecoats | Ecological Lime Finishes</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
         :root {
            /* YOU MUST CHANGE THIS TO MATCH YOUR LOGO'S EXACT BACKGROUND COLOR */
            --header-blue: #05101f;
            /* The separate shade of blue for the body */
            --body-blue: #0A192F;
            --accent-green: #808000;
            --pure-white: #FFFFFF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--body-blue);
            font-family: 'Montserrat', sans-serif;
            color: var(--pure-white);
            overflow-x: hidden;
            /* Extra height added just so you can actually scroll and test the logo spin */
            min-height: 200vh;
        }
        /* 1. THE HEADER */
        
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: var(--header-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        
        .header-logo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            /* Slight rounding so the square isn't harsh */
            will-change: transform;
            /* Performance boost for the spin */
        }
        
        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        /* The 3-Line Hamburger Menu */
        
        .menu-slider-btn {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            padding: 10px;
        }
        
        .menu-slider-btn div {
            width: 30px;
            height: 2px;
            background-color: var(--pure-white);
            transition: 0.3s;
        }
        
        .menu-slider-btn:hover div {
            background-color: var(--accent-green);
        }
        /* 2. THE BOOT ANIMATION (LAKE DROP) */
        
        .hero-lake {
            margin-top: 80px;
            /* Push below header */
            width: 100%;
            height: 55vh;
            background: url('lakemon.jpg') no-repeat center center/cover;
            position: relative;
            /* The Drop Animation */
            transform: translateY(-100%);
            opacity: 0;
            animation: dropLake 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        /* Dark overlay so the lake doesn't blind the user */
        
        .hero-lake::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 47, 0.4);
        }
        
        @keyframes dropLake {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        /* 3. THE SLIDER CARDS (ECOLOGICAL BENEFITS) */
        
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 60px 5%;
            flex-wrap: wrap;
        }
        
        .eco-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--accent-green);
            padding: 40px;
            width: 45%;
            min-width: 300px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            /* Hidden until animation fires */
            opacity: 0;
        }
        
        .eco-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .eco-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .eco-card p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }
        /* Sequenced Slide Animations */
        
        .slide-from-left {
            transform: translateX(-100px);
            /* Delays 0.8s so the lake drops first */
            animation: slideIn 1s cubic-bezier(0.165, 0.84, 0.44, 1) 0.8s forwards;
        }
        
        .slide-from-right {
            transform: translateX(100px);
            /* Delays 1.1s so it follows the left card */
            animation: slideIn 1s cubic-bezier(0.165, 0.84, 0.44, 1) 1.1s forwards;
        }
        
        @keyframes slideIn {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="lc-cr.png" alt="Logo" class="header-logo" id="scroll-logo">
        <div class="header-title">Limecoats</div>
        <div class="menu-slider-btn">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <div class="hero-lake"></div>

    <div class="cards-container">
        <div class="eco-card slide-from-left">
            <h3>Zero VOCs. Pure Air.</h3>
            <p>Our finishes are formulated without synthetic toxins, absorbing carbon dioxide from your environment as they cure.</p>
        </div>
        <div class="eco-card slide-from-right">
            <h3>Living Mineral Textures</h3>
            <p>Naturally breathable surfaces that prevent mold and humidity buildup, sourced directly from the earth to your walls.</p>
        </div>
    </div>

    <script>
        const logo = document.getElementById('scroll-logo');

        document.addEventListener('scroll', () => {
            // Calculate how far down the page the user has scrolled (0.0 to 1.0)
            const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);

            // 4 full rotations = 360 * 4 = 1440 degrees. 
            const degreesToSpin = scrollPercent * 1440;

            // Apply the rotation
            logo.style.transform = `rotate(${degreesToSpin}deg)`;
        });
    </script>

</body>

</html>
