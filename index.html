<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limecoats | Luxury Lime Finish</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="painted-wall">
        <div class="content-wrapper">
            <img src="lclogo.png" alt="Limecoats Logo" class="brand-logo">
            <h1>Luxury Lime Finish</h1>
            <p class="slogan">Breathable. Artisanal. Timeless.</p>
            <div class="contact-block">
                <span>INQUIRIES: ROARINGKILLINLION@GMAIL.COM</span>
                <span>CONNECT: +91 84335 52656</span>
            </div>
        </div>
    </div>

    <div class="curtain" id="paint-curtain">
        <img src="roller.png" alt="Paint Roller" class="roller-img">
        <div class="white-canvas">
            <div class="scroll-indicator">Scroll down to paint</div>
        </div>
    </div>

    <script>
        document.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const maxScroll = document.body.scrollHeight - window.innerHeight;

            // Calculate percentage scrolled (0 to 1)
            const scrollPercent = scrolled / maxScroll;

            // Push the curtain (and roller) down off the screen
            const curtain = document.getElementById('paint-curtain');
            curtain.style.transform = `translateY(${scrollPercent * 110}vh)`;
        });
    </script>

</body>

</html>
